<dialog
  class="modal confirm-dialog"
  data-confirm-dialog
  aria-labelledby="confirm-dialog-title"
  aria-describedby="confirm-dialog-message"
>
  <div class="modal-header">
    <h2 class="modal-title" id="confirm-dialog-title" data-confirm-title>Xác nhận thao tác</h2>
    <button class="modal-close" type="button" data-confirm-cancel aria-label="Đóng">×</button>
  </div>
  <div class="modal-body">
    <p class="confirm-dialog-message" id="confirm-dialog-message" data-confirm-message></p>
  </div>
  <div class="modal-footer">
    <button class="button button-secondary" type="button" data-confirm-cancel>Hủy</button>
    <button class="button button-danger" type="button" data-confirm-accept>Xác nhận</button>
  </div>
</dialog>
