<button
  class="icon-button menu-toggle"
  type="button"
  data-sidebar-toggle
  aria-controls="app-sidebar"
  aria-expanded="false"
  aria-label="Mở menu điều hướng"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 6h16M4 12h16M4 18h16"></path>
  </svg>
</button>

<a class="brand brand-mobile" href="#overview" aria-label="InterTrack - Tổng quan">
  <img class="brand-mark" src="logo.svg" alt="">
  <span class="brand-copy">
    <span>InterTrack</span>
    <span class="brand-tagline">QUẢN LÝ THỰC TẬP</span>
  </span>
</a>

<span class="topbar-context">Không gian làm việc <span aria-hidden="true">/</span> <strong>Tổng quan</strong></span>

<div class="account-menu-container" data-account-menu>
  <button
    class="profile-button"
    type="button"
    data-account-toggle
    aria-label="Tài khoản"
    aria-haspopup="menu"
    aria-controls="account-menu"
    aria-expanded="false"
  >
    <span class="avatar avatar-blue" data-user-initials>SV</span>
    <span class="profile-details">
      <strong data-user-name>Người dùng</strong>
      <span data-user-role></span>
    </span>
    <span class="profile-chevron" aria-hidden="true">⌄</span>
  </button>
  <div class="account-menu" id="account-menu" role="menu" aria-label="Tùy chọn tài khoản" hidden>
    <div class="account-menu-heading">
      <strong data-user-name>Người dùng</strong>
      <span data-user-role></span>
    </div>
    <a class="account-menu-item" href="login.html" role="menuitem" data-logout-link>
      <span aria-hidden="true">↪</span>
      Đăng xuất
    </a>
  </div>
</div>
