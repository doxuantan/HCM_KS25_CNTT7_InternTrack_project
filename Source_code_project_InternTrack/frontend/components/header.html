<button
  class="icon-button menu-toggle"
  type="button"
  data-sidebar-toggle
  aria-controls="app-sidebar"
  aria-expanded="false"
  aria-label="Mở menu điều hướng"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 6h16M4 12h16M4 18h16"></path>
  </svg>
</button>

<a class="brand brand-mobile" href="#overview" aria-label="InternTrack Rikkei - Tổng quan">
  <img class="brand-mark" src="logo.svg?v=2" alt="">
  <span class="brand-copy">
    <span>Intern<span class="brand-accent">Track</span> Rikkei</span>
    <span class="brand-tagline">QUẢN LÝ THỰC TẬP</span>
  </span>
</a>

<span class="topbar-context">Không gian làm việc <span aria-hidden="true">/</span> <strong>Tổng quan</strong></span>
<span class="topbar-spacer"></span>

<button
  class="icon-button theme-toggle"
  type="button"
  data-theme-toggle
  aria-label="Chuyển sang giao diện tối"
  aria-pressed="false"
  title="Chuyển sang giao diện tối"
>
  <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="4"></circle>
    <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
  </svg>
  <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M20.2 15.4A8.4 8.4 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"></path>
  </svg>
</button>

<div class="account-menu-container" data-account-menu>
  <button
    class="profile-button"
    type="button"
    data-account-toggle
    aria-label="Tài khoản"
    aria-haspopup="menu"
    aria-controls="account-menu"
    aria-expanded="false"
  >
    <span class="avatar avatar-blue" data-user-initials>SV</span>
    <span class="profile-details">
      <strong data-user-name>Người dùng</strong>
      <span data-user-role></span>
    </span>
    <span class="profile-chevron" aria-hidden="true">⌄</span>
  </button>
  <div class="account-menu" id="account-menu" role="menu" aria-label="Tùy chọn tài khoản" hidden>
    <div class="account-menu-heading">
      <strong data-user-name>Người dùng</strong>
      <span data-user-role></span>
    </div>
    <a class="account-menu-item" href="login.html" role="menuitem" data-logout-link>
      <span aria-hidden="true">↪</span>
      Đăng xuất
    </a>
  </div>
</div>
